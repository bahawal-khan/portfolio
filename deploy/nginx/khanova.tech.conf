# nginx reverse proxy for khanova.tech:
#   / (static site + 3D hero)   -> next start   (127.0.0.1:3000, via PM2)
#   /api (FastAPI + LangGraph)  -> uvicorn       (127.0.0.1:8001, via PM2)
#
# Setup on the VPS:
#   sudo cp deploy/nginx/khanova.tech.conf /etc/nginx/sites-available/khanova.tech.conf
#   sudo ln -s /etc/nginx/sites-available/khanova.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d khanova.tech -d www.khanova.tech   # provisions the server{} 443 block below via certbot

server {
    listen 80;
    listen [::]:80;
    server_name khanova.tech www.khanova.tech;

    # FastAPI backend — routes already carry the /api prefix (see
    # backend/app/main.py), so this passes the URI through unchanged
    # (no trailing path after the proxy_pass host:port).
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat/stream is Server-Sent Events — buffering/caching would
        # hold tokens back until the response closes instead of streaming
        # them as they're generated.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
